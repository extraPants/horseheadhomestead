name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5
      # Azure/static-web-apps-deploy@v1 uses a 2021 Docker client that rejects
      # current deployment tokens ("No matching Static Web App / invalid api key").
      # SWA CLI 2.x uses StaticSitesClient v2, which works with DeploymentToken auth.
      - name: Deploy
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_GROUND_0B8890C10 }}
        run: |
          mkdir -p dist
          find . -maxdepth 1 -type f ! -name 'README.md' -exec cp -a {} dist/ \;
          npx --yes @azure/static-web-apps-cli@latest deploy dist --env production --no-use-keychain
