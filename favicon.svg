<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Horsehead Homestead">
  <rect width="64" height="64" rx="14" fill="#5c6f56"/>
  <g transform="rotate(-8 32 34)">
    <!-- ears -->
    <ellipse cx="18" cy="17" rx="6.5" ry="11.5" transform="rotate(-20 18 17)" fill="#c4a574"/>
    <ellipse cx="46" cy="18" rx="6.5" ry="11.5" transform="rotate(18 46 18)" fill="#c4a574"/>
    <ellipse cx="18.5" cy="18" rx="2.8" ry="6" transform="rotate(-20 18.5 18)" fill="#e8b4a0"/>
    <ellipse cx="45.5" cy="19" rx="2.8" ry="6" transform="rotate(18 45.5 19)" fill="#e8b4a0"/>
    <!-- face, nudged a hair left -->
    <path fill="#e8d3b0" d="
      M14 30
      C14 19 22 14 32 14.5
      C43 15 51 20 50 31
      C51 37 47 44 43 51
      C40 57 35 60.5 30.5 60
      C25 59.5 20 55 17 49
      C13 42 12 36 14 30
      Z"/>
    <!-- blaze, slightly off-center -->
    <path fill="#faf7f2" d="
      M30 16.5
      C32.5 16 35 16.5 36.5 17.5
      C36 30 34.5 42 32 52.5
      C30.5 54.5 28.5 54.5 27.5 52.5
      C28.5 40 29 28 30 16.5
      Z"/>
    <!-- far-ish eye a touch smaller -->
    <ellipse cx="23.5" cy="30.5" rx="4.6" ry="5.2" fill="#faf7f2"/>
    <circle cx="24.4" cy="31" r="2.8" fill="#2c2520"/>
    <circle cx="25.4" cy="29.8" r="0.95" fill="#faf7f2"/>
    <!-- near eye -->
    <ellipse cx="40.5" cy="30" rx="5.3" ry="5.9" fill="#faf7f2"/>
    <circle cx="41.2" cy="30.6" r="3.15" fill="#2c2520"/>
    <circle cx="42.3" cy="29.3" r="1.1" fill="#faf7f2"/>
    <!-- nostrils -->
    <ellipse cx="26.5" cy="50" rx="2.8" ry="3.4" fill="#c48b78"/>
    <ellipse cx="36" cy="50.8" rx="3.1" ry="3.7" fill="#c48b78"/>
    <path d="M26.5 55 Q31.5 57.5 37 55.2" fill="none" stroke="#9e7b56" stroke-width="1.35" stroke-linecap="round"/>
  </g>
</svg>
